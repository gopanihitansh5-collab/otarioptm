name: CI

# Zero secrets by design: no job below reads a secret, so CI must pass on a
# clean checkout with no API keys. The gateway then runs its demo tier.

on:
  push:
    branches: [main]
  pull_request:

# Stale runs for the same ref get cancelled; only the latest commit's CI burns minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Config truth: every key declared in config/config.yml must exist in the
      # code's DEFAULT_CONFIG, otherwise the key is silently dead. The file is
      # OPTIONAL - when it is absent (fresh checkout, no config) the gateway
      # falls back to DEFAULT_CONFIG and this check passes.
      - name: Config truth check (config/config.yml, optional)
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          import yaml

          sys.path.insert(0, os.getcwd())
          from src.services.budget import DEFAULT_CONFIG

          path = os.environ.get("OTARIOPTM_CONFIG") or "config/config.yml"
          if not os.path.exists(path):
              print(f"{path} not present - gateway falls back to DEFAULT_CONFIG. OK.")
              sys.exit(0)
          with open(path, "r", encoding="utf-8") as fh:
              data = yaml.safe_load(fh) or {}
          unknown = []
          for section, values in data.items():
              ref = DEFAULT_CONFIG.get(section)
              if ref is None:
                  unknown.append(str(section))
              elif isinstance(ref, dict) and isinstance(values, dict):
                  for key in values:
                      if key not in ref:
                          unknown.append(f"{section}.{key}")
          if unknown:
              print("::error::config keys absent from DEFAULT_CONFIG: " + ", ".join(unknown))
              sys.exit(1)
          print(f"{path} OK - every declared key exists in DEFAULT_CONFIG.")
          PY

      # House policy: tests are never silenced. Output is teed to a log so a failed
      # run leaves a post-mortem trail (never started / died mid-run / real failure
      # are distinguished in the next step).
      - name: Run gateway tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest.log

      - name: Post-mortem (why did pytest fail?)
        if: failure()
        shell: bash
        run: |
          if [ ! -f pytest.log ]; then
            echo "::error::pytest never ran - pytest.log missing; checkout or pip install likely failed."
          elif ! grep -qE '={3,}.*in [0-9]+(\.[0-9]+)?s.*={3,}' pytest.log; then
            echo "::error::pytest died mid-run - no summary line in pytest.log; see the uploaded log artifact."
          else
            echo "::error::pytest finished with failures - last 40 lines below, full log in artifact."
            tail -n 40 pytest.log
          fi

      - name: Upload pytest log (failure artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest.log
          if-no-files-found: ignore

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  summary:
    name: CI summary
    needs: [backend, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          backend="${{ needs.backend.result }}"
          web="${{ needs.web.result }}"
          {
            echo "## CI summary"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| backend (FastAPI gateway) | ${backend} |"
            echo "| web (Next.js) | ${web} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$backend" != "success" ] || [ "$web" != "success" ]; then
            echo "::error::CI FAILED - backend=${backend} web=${web}. Open the failed job above for logs."
            exit 1
          fi
          echo "All checks passed."
